# Генерує CherkasyLight.xcodeproj:  brew install xcodegen && xcodegen generate
name: CherkasyLight
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO   # скрипт версії змінює Info.plist зібраного продукту
    # ↓↓↓ ЗМІНІТЬ ЦІ ДВА ЗНАЧЕННЯ НА СВОЇ (єдине місце, де вони задаються) ↓↓↓
    BUNDLE_PREFIX: com.bohdanol
    APP_GROUP_ID: group.com.bohdanol.CherkasyLight

targets:
  CherkasyLight:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: CherkasyLightWidget
    postBuildScripts:
      - name: Set version from git
        script: '"${SRCROOT}/scripts/set-version.sh"'
        basedOnDependencyAnalysis: false
    entitlements:
      path: App/CherkasyLight.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Світло Черкаси
        CFBundleDevelopmentRegion: uk
        AppGroupIdentifier: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).CherkasyLight

  CherkasyLightWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    postBuildScripts:
      - name: Set version from git
        script: '"${SRCROOT}/scripts/set-version.sh"'
        basedOnDependencyAnalysis: false
    entitlements:
      path: Widget/CherkasyLightWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Світло Черкаси
        CFBundleDevelopmentRegion: uk
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).CherkasyLight.Widget

  CherkasyLightTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).CherkasyLightTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CherkasyLight:
    build:
      targets:
        CherkasyLight: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [CherkasyLightTests]
