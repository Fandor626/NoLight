# Генерує NoLight.xcodeproj:  brew install xcodegen && xcodegen generate
name: NoLight
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO   # скрипт версії змінює Info.plist зібраного продукту
    # ↓↓↓ ЗМІНІТЬ ЦІ ДВА ЗНАЧЕННЯ НА СВОЇ (єдине місце, де вони задаються) ↓↓↓
    BUNDLE_PREFIX: com.bohdanol
    APP_GROUP_ID: group.com.bohdanol.NoLight

targets:
  NoLight:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: NoLightWidget
    postBuildScripts:
      - name: Set version from git
        script: '"${SRCROOT}/scripts/set-version.sh"'
        # Вхідний файл = оброблений Info.plist: так Xcode запускає скрипт ПІСЛЯ обробки plist
        # і не затирає версію значеннями з App/Info.plist (NOL-41).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    entitlements:
      path: App/NoLight.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: NoLight
        CFBundleDevelopmentRegion: uk
        AppGroupIdentifier: $(APP_GROUP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [nolight]
        # Екран запуску (NOL-36): логотип на фоні systemGroupedBackground (#F2F2F7 / #000000),
        # як у першого екрана, тож без «спалаху» при переході.
        UILaunchScreen:
          UIImageName: Logo
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UIBackgroundModes: [fetch]
        # Відлік до зміни на заблокованому екрані (NOL-39).
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).NoLight
        # Іконка з App/Assets.xcassets (NOL-35): 1024×1024 + темний і тонований варіанти.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NoLightWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    postBuildScripts:
      - name: Set version from git
        script: '"${SRCROOT}/scripts/set-version.sh"'
        # Вхідний файл = оброблений Info.plist: так Xcode запускає скрипт ПІСЛЯ обробки plist
        # і не затирає версію значеннями з App/Info.plist (NOL-41).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    entitlements:
      path: Widget/NoLightWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: NoLight
        CFBundleDevelopmentRegion: uk
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).NoLight.Widget

  NoLightTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).NoLightTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NoLight:
    build:
      targets:
        NoLight: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [NoLightTests]
